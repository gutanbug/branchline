  items.push(`<button role="menuitem" onclick="closeContextMenu();openNewBranch(${esc(JSON.stringify(name))})">여기서 브랜치 만들기</button>`);
  if(!isCurrent)items.push(`<button role="menuitem" onclick="closeContextMenu();cherryPickBranchHead(${esc(JSON.stringify(name))})">이 브랜치의 최신 커밋 체리픽</button>`);
  items.push(`<button role="menuitem" onclick="closeContextMenu();resetBranchTo(${esc(JSON.stringify(refs[name]))},'soft')">${esc(branch)}을(를) 이 커밋으로 리셋(soft)</button>`);
  items.push(`<button role="menuitem" onclick="closeContextMenu();resetBranchTo(${esc(JSON.stringify(refs[name]))},'mixed')">${esc(branch)}을(를) 이 커밋으로 리셋(mixed)</button>`);
  items.push(`<button role="menuitem" onclick="closeContextMenu();resetBranchTo(${esc(JSON.stringify(refs[name]))},'hard')">${esc(branch)}을(를) 이 커밋으로 리셋(hard)</button>`);
  items.push(`<button role="menuitem" onclick="closeContextMenu();revertCommitAction(${esc(JSON.stringify(refs[name]))})">이 커밋 되돌리기(revert)</button>`);
  items.push(sep);
  items.push(`<button role="menuitem" onclick="closeContextMenu();renameBranchPrompt(${esc(JSON.stringify(name))})">이름 바꾸기</button>`);
  if(!isCurrent)items.push(`<button role="menuitem" onclick="closeContextMenu();deleteBranchAction(${esc(JSON.stringify(name))})">삭제</button>`);
  items.push(sep);
}
items.push(`<button role="menuitem" onclick="copyToClipboard(${esc(JSON.stringify(name))});closeContextMenu()">브랜치 이름 복사</button>`);
items.push(`<button role="menuitem" onclick="copyToClipboard(${esc(JSON.stringify(refs[name]))});closeContextMenu()">커밋 SHA 복사</button>`);
if(realMode&&githubRemote){
  items.push(`<button role="menuitem" onclick="copyToClipboard(${esc(JSON.stringify(`https://github.com/${githubRemote.owner}/${githubRemote.repo}/tree/${name.replace(/^origin\//,'')}`))});closeContextMenu()">브랜치 링크 복사</button>`);
  items.push(`<button role="menuitem" onclick="copyToClipboard(${esc(JSON.stringify(`https://github.com/${githubRemote.owner}/${githubRemote.repo}/commit/${refs[name]}`))});closeContextMenu()">커밋 링크 복사</button>`);
}
items.push(sep);
if(!isRemote)items.push(`<button role="menuitem" onclick="hideBranch(${esc(JSON.stringify(name))});closeContextMenu()">숨기기</button>`);
items.push(`<button role="menuitem" onclick="closeContextMenu();togglePinned(${esc(JSON.stringify(name))})">${pinnedRefs.has(name)?'왼쪽 고정 해제':'왼쪽에 고정'}</button>`);
items.push(`<button role="menuitem" onclick="toggleSolo(${esc(JSON.stringify(name))});closeContextMenu()">${soloRefs.has(name)?'솔로 해제':'솔로'}</button>`);
items.push(`<button role="menuitem" onclick="closeContextMenu();source=${esc(JSON.stringify(name))};target=${esc(JSON.stringify(isCurrent?(defaultBranchName()===name?Object.keys(refs).find(b=>!b.startsWith('origin/')&&b!==name)||name:defaultBranchName()):branch))};switchView('compare')">다른 브랜치와 비교</button>`);
if(realMode&&!isRemote){
  items.push(sep);
  items.push(`<button role="menuitem" onclick="closeContextMenu();createTagPrompt(${esc(JSON.stringify(name))},false)">여기에 태그 만들기</button>`);
  items.push(`<button role="menuitem" onclick="closeContextMenu();createTagPrompt(${esc(JSON.stringify(name))},true)">여기에 주석 태그 만들기</button>`);
}
menu.innerHTML=items.join('');menu.hidden=false;const maxX=window.innerWidth-260,maxY=window.innerHeight-160;menu.style.left=Math.max(4,Math.min(event.clientX,maxX))+'px';menu.style.top=Math.max(4,Math.min(event.clientY,maxY))+'px';}
function openTagMenu(event,name){event.preventDefault();event.stopPropagation();if(!realMode)return;const menu=$('context-menu');menu.innerHTML=[
  `<button role="menuitem" onclick="copyToClipboard(${esc(JSON.stringify(name))});closeContextMenu()">태그 이름 복사</button>`,
  `<button role="menuitem" onclick="closeContextMenu();pushTagAction(${esc(JSON.stringify(name))})">원격에 Push</button>`,
  `<button role="menuitem" onclick="closeContextMenu();deleteTagAction(${esc(JSON.stringify(name))})">삭제</button>`
].join('');menu.hidden=false;const maxX=window.innerWidth-220,maxY=window.innerHeight-150;menu.style.left=Math.max(4,Math.min(event.clientX,maxX))+'px';menu.style.top=Math.max(4,Math.min(event.clientY,maxY))+'px';}
async function pushTagAction(name){notify(`태그 ${name} push 중...`);const result=await window.gitAPI.tagPush(repoPath,'origin',name);await applyResult(result,`태그 ${name}을(를) origin으로 push했습니다.`);}
async function deleteTagAction(name){if(!confirm(`태그 ${name}을(를) 삭제할까요? (로컬에서만 삭제되며 원격 태그는 남아있을 수 있습니다)`))return;const result=await window.gitAPI.tagDelete(repoPath,name);await applyResult(result,`태그 ${name}을(를) 삭제했습니다.`);}
function togglePinned(name){if(pinnedRefs.has(name))pinnedRefs.delete(name);else pinnedRefs.add(name);render();}
async function pullBranchAction(name){if(!refs['origin/'+name]){notify('원격에 대응하는 브랜치가 없습니다.');return;}if(name===branch){await pullRepo();return;}notify(`${name}을(를) 최신 상태로 가져오는 중...`);const result=await window.gitAPI.fetchBranch(repoPath,'origin',name);await applyResult(result,`${name}을(를) origin/${name}로 갱신했습니다.`);}
async function pushBranchAction(name,setUpstream){notify(`${name} 브랜치를 push하는 중...`);const result=await window.gitAPI.push(repoPath,'origin',name,setUpstream);await applyResult(result,`${name}을(를) origin으로 push했습니다.${setUpstream?' (upstream 설정됨)':''}`);}
async function cherryPickBranchHead(name){const sha=refs[name];notify('체리픽 진행 중...');const result=await window.gitAPI.cherryPick(repoPath,sha);if(!result.ok){notify(`체리픽 충돌: ${result.message} 터미널에서 파일을 해결한 뒤 계속하거나 git cherry-pick --abort로 되돌리세요.`);await refreshSnapshot();return;}mapSnapshot(result.value);render();notify(`${esc(name)}의 최신 커밋을 ${esc(branch)}에 체리픽했습니다.`);}
function createTagPrompt(name,annotated){modal(annotated?'주석 태그 만들기':'태그 만들기',`<p class="num" style="overflow-wrap:anywhere">${esc(name)} · ${esc((refs[name]||'').slice(0,10))}</p><form onsubmit="event.preventDefault();createTagAction(${esc(JSON.stringify(name))},${annotated},this.elements.name.value.trim(),this.elements.message?this.elements.message.value:'')"><div class="field"><label for="tag-name-input">태그 이름</label><input id="tag-name-input" class="input" name="name" required autofocus></div>${annotated?`<div class="field" style="margin-top:16px"><label for="tag-message-input">태그 메시지</label><textarea id="tag-message-input" class="textarea" name="message" required></textarea></div>`:''}<div class="row" style="margin-top:16px;gap:8px"><button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button><button class="btn btn-primary">만들기</button></div></form>`);}
async function createTagAction(name,annotated,tagName,message){if(!tagName){closeModal();return;}const result=await window.gitAPI.tagCreate(repoPath,tagName,refs[name],annotated?message:undefined,false);closeModal();if(!result.ok){notify(result.message);return;}mapSnapshot(result.value);render();notify(`태그 ${tagName}을(를) 만들었습니다.`);}
function openCompareModal(a,b){modal(`${a} ↔ ${b} 비교`,compareModalBody(a,b));}
function compareModalBody(a,b){if(!refs[a]||!refs[b])return '<p class="detail-note">비교할 수 없는 브랜치입니다.</p>';const p=compareRefs(a,b);const commitRow=c=>`<div class="log-row" style="padding:8px 0"><div class="commit-title" style="font-size:13px">${esc(c.title)}</div><div class="commit-meta"><span>${esc(c.author)}</span><span class="num">${esc(c.sha)}</span><span>${fullDateTime(c)}</span></div></div>`;return `<div class="branch-select" style="margin-bottom:14px"><label for="compare-modal-target">비교 대상 브랜치</label><select class="input" id="compare-modal-target" onchange="openCompareModal(${esc(JSON.stringify(a))},this.value)">${options(b)}</select></div><div class="compare-summary" style="margin-bottom:14px"><span><b>${p.source.length}</b> ${esc(a)}에만</span><span><b>${p.target.length}</b> ${esc(b)}에만</span><span><b>${p.common.length}</b> 공통 커밋</span></div><div style="max-height:46vh;overflow:auto">${p.source.length?`<p class="detail-sub">${esc(a)}에만 있는 커밋 (${esc(a)}이(가) ${p.source.length}개 앞섬)</p>${p.source.map(commitRow).join('')}`:''}${p.target.length?`<p class="detail-sub">${esc(b)}에만 있는 커밋 (${esc(a)}이(가) ${p.target.length}개 뒤처짐)</p>${p.target.map(commitRow).join('')}`:''}${!p.source.length&&!p.target.length?'<p class="detail-note">두 브랜치의 커밋이 동일합니다.</p>':''}</div><div class="row" style="margin-top:14px;gap:8px"><button class="btn btn-secondary" onclick="closeModal()">닫기</button><button class="btn btn-primary" onclick="closeModal();source=${esc(JSON.stringify(a))};target=${esc(JSON.stringify(b))};switchView('compare')">전체 비교 화면에서 열기</button></div>`;}
function renameBranchPrompt(name){modal('브랜치 이름 바꾸기',`<form onsubmit="event.preventDefault();renameBranchAction(${esc(JSON.stringify(name))},this.elements.name.value.trim())"><div class="field"><label for="rename-branch-name">새 이름</label><input class="input" id="rename-branch-name" name="name" required value="${esc(name)}" pattern="[A-Za-z0-9][A-Za-z0-9/_-]*"></div><div class="row">${cancelButton()}<button class="btn btn-primary">이름 바꾸기</button></div></form>`);}
async function renameBranchAction(oldName,newName){if(!newName||newName===oldName){closeModal();return;}const result=await window.gitAPI.renameBranch(repoPath,oldName,newName);closeModal();if(!result.ok){notify(result.message);return;}mapSnapshot(result.value);if(branch===oldName)branch=newName;if(viewBranch===oldName)viewBranch=newName;if(soloRefs.has(oldName)){soloRefs.delete(oldName);soloRefs.add(newName);}render();notify(`${oldName}을(를) ${newName}(으)로 이름을 바꿨습니다.`);}
async function deleteBranchAction(name){if(!confirm(`${name} 브랜치를 삭제할까요? 병합되지 않은 커밋이 있으면 실패합니다.`))return;const result=await window.gitAPI.deleteBranch(repoPath,name,false);if(result.ok){mapSnapshot(result.value);hiddenRefs.delete(name);soloRefs.delete(name);render();notify(`${name} 브랜치를 삭제했습니다.`);return;}if(!confirm(`${result.message}\n강제로 삭제할까요? (병합되지 않은 커밋이 사라질 수 있습니다)`)){notify(result.message);return;}const forced=await window.gitAPI.deleteBranch(repoPath,name,true);if(!forced.ok){notify(forced.message);return;}mapSnapshot(forced.value);hiddenRefs.delete(name);soloRefs.delete(name);render();notify(`${name} 브랜치를 강제 삭제했습니다.`);}
async function quickStashPop(){if(!stashes.length){notify('스태시가 없습니다.');return;}if(realMode){const result=await window.gitAPI.stashPop(repoPath,stashes[0].ref);if(!result.ok){notify(result.message);return;}mapSnapshot(result.value);switchView('changes');notify('가장 최근 스태시를 적용하고 제거했습니다.');return;}const top=stashes.shift();if(top.files.some(f=>wip.some(w=>w.path===f.path))){stashes.unshift(top);notify('같은 경로의 작업 변경이 있어 Pop을 중단했습니다.');return;}wip.push(...structuredClone(top.files).map(f=>({...f,staged:false})));switchView('changes');notify('예제 스태시를 Pop했습니다.');}
function copyToClipboard(text){if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>notify('클립보드에 복사했습니다.')).catch(()=>notify('복사에 실패했습니다.'));}else notify('이 환경에서는 클립보드 복사를 지원하지 않습니다.');}
document.addEventListener('click',event=>{if(!$('context-menu').hidden&&!$('context-menu').contains(event.target))closeContextMenu();});
document.addEventListener('contextmenu',event=>{if(!event.target.closest('.commit-row')&&!event.target.closest('.branch-item'))closeContextMenu();});
document.addEventListener('keydown',event=>{if((event.metaKey||event.ctrlKey)&&event.key.toLowerCase()==='k'){event.preventDefault();if(!$('modal').open)openCommands();}if(event.key==='Escape')closeContextMenu();});
$('modal').addEventListener('click',event=>{if(event.target===$('modal')){const r=$('modal').getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeModal();}});
applyColWidths();
render();
restoreOpenRepos();
</script>
</body>
