<!doctype html>

<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Branchline — 브랜치 비교</title>
  <style>
    /* ─── tokens ─────────────────────────────────────────────────────────
       Six variables. Bind them to the active DESIGN.md and stop.
       Do not introduce raw hex anywhere else in this file. */
    :root {
      --bg:      oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --fg:      oklch(22% 0.02 240);
      --muted:   oklch(50% 0.018 240);
      --border:  oklch(90% 0.008 240);
      --accent:  oklch(58% 0.16 145);
      --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --accent-soft: color-mix(in oklch, var(--accent) 14%, transparent);
      --fg-soft: color-mix(in oklch, var(--fg) 6%, transparent);
      /* scale — clamp() so it works at 1280, 1440, 1920 without media queries */
      --fs-h1: clamp(44px, 6vw, 76px);
      --fs-h2: clamp(32px, 4vw, 48px);
      --fs-h3: 22px;
      --fs-lead: 19px;
      --fs-body: 16px;
      --fs-meta: 13px;

      /* spacing — 8-point grid */
      --gap-xs: 8px;
      --gap-sm: 12px;
      --gap-md: 20px;
      --gap-lg: 32px;
      --gap-xl: 56px;
      --gap-2xl: 96px;
      --container: 1120px;
      --gutter: 32px;

      --radius: 10px;
      --radius-lg: 16px;
    }

    /* ─── reset & base ──────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: var(--fs-body);
      line-height: 1.55;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
    }
    img, svg { display: block; max-width: 100%; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; cursor: pointer; }
    p { text-wrap: pretty; }
    h1, h2, h3, h4 { text-wrap: balance; }

    /* ─── layout primitives ─────────────────────────────────────────── */
    .container {
      max-width: var(--container);
      margin-inline: auto;
      padding-inline: var(--gutter);
    }
    .section {
      padding-block: clamp(48px, 8vw, var(--gap-2xl));
    }
    .section + .section { border-top: 1px solid var(--border); }
    .stack { display: flex; flex-direction: column; }
    .stack > * + * { margin-top: var(--gap-md); }
    .row { display: flex; align-items: center; gap: var(--gap-md); }
    .row-between { display: flex; align-items: center; justify-content: space-between; gap: var(--gap-md); }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--gap-lg); }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--gap-lg); }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--gap-md); }
    .grid-2-1 { display: grid; grid-template-columns: 2fr 1fr; gap: var(--gap-xl); align-items: start; }
    .grid-1-2 { display: grid; grid-template-columns: 1fr 2fr; gap: var(--gap-xl); align-items: start; }
    @media (max-width: 920px) {
      .grid-2, .grid-3, .grid-4, .grid-2-1, .grid-1-2 { grid-template-columns: 1fr; }
    }

    /* ─── type ──────────────────────────────────────────────────────── */
    .h1, h1 { font-family: var(--font-display); font-size: var(--fs-h1); line-height: 1.04; letter-spacing: -0.02em; margin: 0; }
    .h2, h2 { font-family: var(--font-display); font-size: var(--fs-h2); line-height: 1.1; letter-spacing: -0.015em; margin: 0; }
    .h3, h3 { font-size: var(--fs-h3); font-weight: 600; line-height: 1.3; letter-spacing: -0.005em; margin: 0; }
    .lead   { font-size: var(--fs-lead); line-height: 1.55; color: var(--muted); max-width: 60ch; margin: 0; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 var(--gap-md);
    }
    .meta { font-family: var(--font-mono); font-size: var(--fs-meta); color: var(--muted); }
    .num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

    /* ─── chrome: nav + footer ──────────────────────────────────────── */
    .topnav {
      position: sticky; top: 0; z-index: 10;
      background: color-mix(in oklch, var(--bg) 92%, transparent);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .topnav-inner { display: flex; align-items: center; justify-content: space-between; padding-block: 14px; }
    .topnav .logo { font-family: var(--font-display); font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
    .topnav nav { display: flex; gap: var(--gap-lg); }
    .topnav nav a { font-size: 14px; color: var(--muted); }
    .topnav nav a:hover { color: var(--fg); }
    .pagefoot { padding-block: var(--gap-xl); color: var(--muted); font-size: 13px; border-top: 1px solid var(--border); }
    .pagefoot .row-between { flex-wrap: wrap; gap: var(--gap-md); }

    /* ─── buttons ───────────────────────────────────────────────────── */
    .btn {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 20px;
      border-radius: var(--radius);
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 500;
      letter-spacing: -0.005em;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    }
    .btn:active { transform: translateY(1px); }
    .btn-primary { background: var(--accent); color: var(--surface); border-color: var(--accent); }
    .btn-primary:hover { background: color-mix(in oklch, var(--accent) 88%, black); }
    .btn-secondary { background: transparent; color: var(--fg); border-color: var(--border); }
    .btn-secondary:hover { border-color: var(--fg); }
    .btn-ghost { background: transparent; color: var(--fg); border-color: transparent; padding-inline: 8px; }
    .btn-ghost:hover { color: var(--accent); }
    .btn-arrow::after { content: '→'; transition: transform 0.15s ease; }
    .toolbar-btn { display:inline-flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 12px; border:1px solid transparent; border-radius:8px; background:transparent; color:var(--fg); font-size:10px; font-weight:500; letter-spacing:-0.005em; min-width:52px; white-space:nowrap; transition:background 0.15s ease; }
    .toolbar-btn .ico { width:18px; height:18px; }
    .toolbar-btn:hover:not([disabled]) { background:var(--fg-soft); }
    .toolbar-btn:active:not([disabled]) { transform:translateY(1px); }
    .toolbar-btn[disabled] { opacity:.4; cursor:not-allowed; }
    .toolbar-divider { width:1px; align-self:stretch; margin:6px 2px; background:var(--border); }
    .btn-arrow:hover::after { transform: translateX(2px); }

    /* ─── card / surface ────────────────────────────────────────────── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px;
    }
    .card-flat { background: transparent; border: 0; padding: 0; }
    .card-rule { background: transparent; border: 0; border-top: 1px solid var(--fg); padding: 24px 0 0; border-radius: 0; }

    /* ─── feature cell (icon + h3 + p) ──────────────────────────────── */
    .feature .feature-mark {
      width: 36px; height: 36px;
      display: grid; place-items: center;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--accent);
      margin-bottom: var(--gap-md);
    }
    .feature .feature-mark svg { width: 18px; height: 18px; }
    .feature h3 { margin-bottom: 6px; }
    .feature p  { margin: 0; color: var(--muted); font-size: 15px; }

    /* ─── stat (big number + label) ─────────────────────────────────── */
    .stat .stat-num {
      font-family: var(--font-display);
      font-size: clamp(56px, 8vw, 96px);
      line-height: 0.95;
      letter-spacing: -0.04em;
      color: var(--accent);
      font-weight: 600;
    }
    .stat .stat-label { color: var(--muted); font-size: 14px; margin-top: 8px; max-width: 24ch; }
    .stat .stat-unit  { font-size: 0.5em; opacity: 0.7; margin-left: 2px; }

    /* ─── quote / testimonial ───────────────────────────────────────── */
    .quote {
      font-family: var(--font-display);
      font-size: clamp(24px, 2.6vw, 32px);
      line-height: 1.32;
      letter-spacing: -0.01em;
      max-width: 28ch;
    }
    .quote-author { color: var(--muted); font-size: 14px; margin-top: var(--gap-md); }
    .quote-mark   {
      font-family: var(--font-display);
      font-size: 140px; line-height: 0.7;
      color: var(--accent); opacity: 0.18;
      margin-bottom: -28px;
    }

    /* ─── pill / badge / tag ────────────────────────────────────────── */
    .pill {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 4px 10px;
      background: var(--accent-soft);
      color: var(--accent);
      border-radius: 999px;
      font-family: var(--font-mono);
      font-size: 11px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .tag {
      display: inline-flex; align-items: center;
      padding: 4px 10px;
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 12px;
    }

    /* ─── form field ────────────────────────────────────────────────── */
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--muted); }
    .input, .textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--fg);
      font: inherit;
      font-size: 15px;
    }
    .input:focus, .textarea:focus {
      outline: 2px solid var(--accent-soft);
      border-color: var(--accent);
    }
    .textarea { min-height: 96px; resize: vertical; line-height: 1.55; }

    /* ─── table (data-style, no chrome) ─────────────────────────────── */
    .ds-table { width: 100%; border-collapse: collapse; font-size: 14px; }
    .ds-table th, .ds-table td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }
    .ds-table tbody tr:hover { background: var(--fg-soft); }
    .ds-table .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }

    /* ─── image placeholder (DS-tinted block, never broken <img>) ──── */
    .ph-img {
      background:
        linear-gradient(135deg, var(--accent-soft), var(--fg-soft)),
        var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      aspect-ratio: 16 / 10;
      display: grid; place-items: center;
      color: var(--muted);
      font-family: var(--font-mono);
      font-size: 12px;
      letter-spacing: 0.04em;
    }
    .ph-img.square    { aspect-ratio: 1 / 1; }
    .ph-img.portrait  { aspect-ratio: 3 / 4; }
    .ph-img.wide      { aspect-ratio: 16 / 9; }
    .content-img {
      display: block;
      max-width: 100%;
      max-height: min(70vh, 720px);
      width: auto;
      height: auto;
      object-fit: contain;
      justify-self: center;
      border-radius: var(--radius-lg);
    }

    /* ─── divider ───────────────────────────────────────────────────── */
    .rule  { border: 0; border-top: 1px solid var(--border); margin: 0; }
    .rule-strong { border: 0; border-top: 1px solid var(--fg); margin: 0; }

    /* ─── hero variants used by layouts.md ──────────────────────────── */
    .hero          { padding-block: clamp(80px, 12vw, 160px); }
    .hero-center   { text-align: center; max-width: 32ch; margin-inline: auto; }
    .hero h1       { margin-bottom: var(--gap-md); }
    .hero .lead    { margin-bottom: var(--gap-lg); }
    .hero-cta      { display: inline-flex; gap: var(--gap-sm); flex-wrap: wrap; }
    .hero-center .hero-cta { justify-content: center; }
    .hero-split    { display: grid; grid-template-columns: 1fr 1fr; gap: var(--gap-2xl); align-items: center; }
    @media (max-width: 920px) { .hero-split { grid-template-columns: 1fr; } }

    /* ─── log row (newsletter, blog list, changelog) ────────────────── */
    .log-row { display: grid; grid-template-columns: 120px 1fr 100px; gap: var(--gap-lg); padding: 22px 0; border-top: 1px solid var(--border); align-items: baseline; }
    .log-row .meta { color: var(--muted); }
    .log-row h3 { font-size: 19px; }
    .log-row .pull { text-align: right; }

    /* 시드의 비교 표·변경 이력 목록을 데스크톱 작업 화면에 맞게 확장 */
    :root { --fs-body: 13px; --fs-meta: 11px; --fs-h1: 26px; --fs-h2: 19px; --fs-h3: 15px; --radius: 7px; }
    body { font-size:13px; letter-spacing:-.015em; }
    button,input,select,textarea { font:inherit; color:var(--fg); }
    button { background:transparent; border:0; }
    button,a,input,select,summary { -webkit-tap-highlight-color:transparent; }
    button,select,summary { min-height:44px; }
    button:disabled { opacity:.45; cursor:not-allowed; }
    :focus-visible { outline:2px solid var(--fg); outline-offset:3px; }
    input:focus-visible,select:focus-visible { outline:2px solid var(--fg); }
    .btn { font-size:12px; min-height:44px; padding:8px 13px; justify-content:center; }
    .btn-primary { color:var(--fg); background:color-mix(in oklch,var(--accent) 82%,var(--surface)); border-color:transparent; }
    .btn-primary:hover { background:color-mix(in oklch,var(--accent) 65%,var(--surface)); color:var(--fg); }
    .btn-ghost:hover { color:var(--fg); background:var(--fg-soft); }
    .btn-secondary:hover { background:var(--fg-soft); color:var(--fg); }
    .appbar { height:58px; padding:0 22px; background:var(--surface); border-bottom:1px solid var(--border); display:flex; align-items:center; gap:24px; }
    .wordmark { font-size:19px; font-weight:720; letter-spacing:-.8px; display:flex; gap:10px; align-items:center; min-width:169px; }
    .mark { width:27px; height:29px; }
    .appbar .repo-tab { border-inline:1px solid var(--border); align-self:stretch; padding:0 22px; display:flex; align-items:center; gap:12px; }
    .appbar .meta { margin-left:auto; }
    .shell { display:grid; grid-template-columns:216px minmax(0,1fr); min-height:calc(100vh - 90px); }
    .sidebar { background:var(--bg); border-right:1px solid var(--border); padding:22px 12px 16px; display:flex; flex-direction:column; gap:23px; }
    .sidebar nav { display:flex; flex-direction:column; gap:3px; }
    .side-button { display:flex; gap:10px; align-items:center; width:100%; padding:0 12px; border-radius:6px; text-align:left; color:var(--muted); font-weight:500; }
    .side-button:hover { background:var(--fg-soft); color:var(--fg); }
    .side-button[aria-current="page"] { background:var(--surface); color:var(--fg); box-shadow:0 1px 4px var(--fg-soft); font-weight:650; }
    .side-button .count { margin-left:auto; font:11px var(--font-mono); }
    .ico { width:17px;height:17px; flex:none; stroke:currentColor; fill:none; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
    .branch-item { padding-left:20px; font-family:var(--font-mono); font-size:11px; gap:10px; overflow-wrap:anywhere; }
    .branch-item .ico { width:13px; }
    .tree-leaf { padding-left:40px; }
    .sidebar details summary { display:flex; align-items:center; padding:0 12px; color:var(--muted); cursor:pointer; list-style:none; gap:10px; }
    .sidebar details summary::before { content:'›'; font-size:11px; width:10px; flex:none; }
    .sidebar details[open] summary::before { content:'⌄'; }
    .sidebar > details { margin-top:-12px; }
    .branch-folder { margin-top:2px; }
    .branch-folder summary { font-family:var(--font-mono); font-size:11px; padding-left:20px; color:var(--muted); }
    .branch-folder summary .ico { width:13px; }
    .branch-folder summary:hover { color:var(--fg); }
    .sidebar-bottom { margin-top:auto; padding-top:18px; border-top:1px solid var(--border); }
    .workspace { min-width:0; background:var(--surface); position:relative; }
    .view-overlay { position:absolute; inset:0; background:var(--surface); overflow-y:auto; z-index:4; animation:overlayIn .16s ease-out; }
    .view-overlay[hidden] { display:none; }
    @keyframes overlayIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    .workspace-head { padding:27px 30px 20px; }
    .crumb { color:var(--muted); font-size:11px; margin-bottom:12px; }
    .head-title { display:flex; align-items:center; gap:12px; }
    .head-title h1 { font-size:26px; font-weight:650; letter-spacing:-1.1px; }
    .subline { margin:10px 0 0; color:var(--muted); font-size:12px; }
    .neutral-tag { display:inline-flex; align-items:center; padding:3px 7px; border:1px solid var(--border); border-radius:5px; font-size:10px; color:var(--muted); }
    .branch-compare { margin:0 30px 22px; display:grid; grid-template-columns:1fr 48px 1fr; align-items:center; gap:12px; }
    .branch-select { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:11px 16px; min-width:0; }
    .branch-select label { display:block;font-size:10px; color:var(--muted); margin-bottom:1px; }
    .branch-select select { width:100%; background:transparent;border:0; font:13px var(--font-mono);min-height:44px; padding:0; }
    .swap { border:1px solid var(--border); border-radius:50%; width:44px; height:44px; min-height:44px; justify-self:center; font-size:19px; }
    .swap:hover { background:var(--fg-soft); }
    .compare-summary { margin:0 30px 20px; display:flex; align-items:center; flex-wrap:wrap; gap:22px; font-size:11px; color:var(--muted); }
    .compare-summary b { font:600 16px var(--font-mono);color:var(--fg); margin-right:5px; }
    .compare-summary .summary-end { margin-left:auto; display:flex; gap:6px; align-items:center; }
    .work-split { display:grid; grid-template-columns:minmax(0,1fr) 292px; border-top:1px solid var(--border); min-height:570px; }
    .history { min-width:0; }
    .view-tabs { display:flex; gap:22px; padding:0 24px; border-bottom:1px solid var(--border); }
    .view-tabs button { font-size:12px; padding:0 2px; color:var(--muted); position:relative; }
    .view-tabs button[aria-selected="true"] { color:var(--fg);font-weight:650; }
    .view-tabs button[aria-selected="true"]::after { position:absolute; content:''; height:2px; bottom:0; left:0; right:0; background:var(--fg); }
    .view-tabs button:hover { color:var(--fg); }
    .filterbar { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:14px 20px; }
    .search-wrap { display:flex; align-items:center; gap:8px; flex:1; min-width:160px; padding:0 9px; background:var(--bg); border:1px solid var(--border); border-radius:6px; }
    .search-wrap input { width:100%; min-width:0; height:44px; background:none; border:0; font-size:11px; }
    .search-wrap .ico { width:14px; }
    .compact-select { border:1px solid var(--border);border-radius:6px;background:var(--surface); min-height:44px; max-width:100%; padding:0 9px; font-size:11px; }
    .result-meta { padding:0 20px 12px; display:flex; align-items:center; justify-content:space-between; font-size:10px; color:var(--muted); gap:10px; }
    .result-meta button { font-size:10px; min-height:44px; text-decoration:underline; }
    :root { --col-graph:90px; --col-date:170px; }
    .commit-head { height:30px; display:grid; grid-template-columns:34px var(--col-graph) minmax(0,1fr) var(--col-date); column-gap:12px; align-items:center; background:var(--bg); border-block:1px solid var(--border); padding:0 16px; color:var(--muted); font-size:10px; position:relative; }
    .commit-head span { position:relative; display:flex; align-items:center; height:100%; }
    .col-resizer { position:absolute; top:0; right:-8px; width:16px; height:100%; min-height:0; padding:0; border:0; background:transparent; cursor:col-resize; z-index:6; }
    .col-resizer::after { content:''; position:absolute; top:4px; bottom:4px; left:7px; width:1px; background:var(--border); }
    .col-resizer:hover::after, .col-resizer:active::after { background:var(--accent); }
    .col-resizer:focus-visible { outline:2px solid var(--accent); outline-offset:-2px; }
    .graph-body { position:relative; }
    .graph-canvas { position:absolute; top:0; left:62px; width:var(--col-graph); pointer-events:none; z-index:1; }
    .commit-row { display:grid; grid-template-columns:34px var(--col-graph) minmax(0,1fr) var(--col-date); column-gap:12px; height:32px; align-items:center; padding:0 16px; border-bottom:1px solid color-mix(in oklch,var(--border) 55%,var(--surface)); position:relative; }
    .commit-row:hover { background:var(--bg); }
    .commit-row.selected { background:var(--fg-soft); }
    .log-row.selected { background:var(--fg-soft); }
    .commit-row.current { box-shadow:inset 3px 0 var(--fg); }
    .check-wrap { width:34px; min-height:32px; display:grid; place-items:center; cursor:pointer; }
    input[type="checkbox"] { width:14px;height:14px;accent-color:var(--fg);cursor:pointer; }
    .commit-open { min-width:0;text-align:left;padding:0;min-height:auto;display:flex;align-items:center;gap:10px;overflow:hidden;width:100%; }

$('branch-list').innerHTML=renderBranchNode(buildBranchTree(localBranches),b=>renderLocalLeaf(b,localBranches.indexOf(b)),branch);$('branch-count').textContent=localBranches.length;$('hidden-branch-note').innerHTML=hiddenRefs.size?`<p class="detail-note" style="padding:4px 12px">숨긴 브랜치 ${hiddenRefs.size}개 · ${[...hiddenRefs].map(b=>`<button class="btn btn-secondary" style="font-size:10px;padding:1px 6px;margin:2px 4px 0 0" onclick="unhideBranch(${esc(JSON.stringify(b))})">${esc(b)} 표시</button>`).join('')}</p>`:'';if(realMode){$('remote-branch-count').textContent=remoteBranches.length;const renderRemoteLeaf=b=>{const localCounterpart=b.replace(/^origin\//,'');const compareTo=refs[localCounterpart]?localCounterpart:defaultB;return `<button class="side-button branch-item tree-leaf" data-od-id="remote-branch-${esc(b)}" onclick="selectBranchView(${esc(JSON.stringify(b))})" ondblclick="showBranch(${esc(JSON.stringify(b))})" oncontextmenu="openBranchMenu(event,${esc(JSON.stringify(b))},true)">${icon('branch')}<span class="row" style="gap:8px;min-width:0;flex:1;overflow:hidden"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(b.split('/').slice(-1)[0])}</span></span>${divergenceBadge(b,compareTo)}</button>`;};$('remote-branch-list').innerHTML=remoteBranches.length?renderBranchNode(buildBranchTree(remoteBranches),renderRemoteLeaf,'origin/'+branch):'<p class="detail-note" style="padding:8px 16px">원격 브랜치가 없습니다.</p>';$('tag-count').textContent=tagsList.length;$('tag-list').innerHTML=tagsList.length?tagsList.map((t,i)=>`<button class="side-button branch-item" data-od-id="tag-${i}" onclick="notify('태그 ${esc(t.name)} · ${t.sha.slice(0,7)}')" oncontextmenu="openTagMenu(event,${esc(JSON.stringify(t.name))})">${esc(t.name)}</button>`).join(''):'<p class="detail-note" style="padding:8px 16px">태그가 없습니다.</p>';}$('stash-count').textContent=stashes.length;$('stash-list').innerHTML=stashes.map((s,i)=>`<button class="side-button branch-item" data-od-id="stash-${ function heading(title,sub,action='',onClose="switchView('graph')"){return `<header class="workspace-head" data-od-id="workspace-heading"><div class="row-between"><div class="crumb">${esc(realMode?repoName:'branchline-desktop')} <span aria-hidden="true">/</span> ${title}</div><button class="btn btn-ghost" data-od-id="overlay-close" onclick="${onClose}" aria-label="닫고 커밋 그래프로 돌아가기" title="닫고 커밋 그래프로 돌아가기">✕ 닫기</button></div><div class="row-between"><div class="head-title"><h1 data-od-id="view-title">${title}</h1><span class="neutral-tag">${realMode?'실제 저장소':'예제'}</span></div>${action}</div><p class="subline">${sub}</p></header>`;}

function renderHistory(){const rows=getRows(),visible=new Set(rows.map(c=>c.id));selected=new Set([...selected].filter(id=>visible.has(id)));$('result-count').textContent=`${rows.length}개 커밋 표시 · 일치하지 않는 이력은 숨김${author?' · '+author:''}${since?' · '+since+'부터':''}`;if(!rows.some(c=>c.id===activeId))activeId=null;const p=compareRefs(source,target);const sourceIds=new Set(p.source.map(c=>c.id));if(fileMode){const activeCommit=rows.find(c=>c.id===activeId);$('history-content').innerHTML=activeCommit?`<div style="padding:0 20px"><article class="file-item" data-od-id="changed-file-0"><span class="file-status">M</span><span style="overflow-wrap:anywhere">${esc(activeCommit.file)}</span></article><p class="detail-note">"${esc(activeCommit.title)}" 커밋에서 변경된 파일입니다.</p></div>`:'<div class="empty">커밋을 선택하면 변경 내용을 볼 수 있습니다.</div>';}else{$('history-content').innerHTML=`<div class="commit-head"><span></span><span>그래프<button type="button" class="col-resizer" aria-label="그래프 열 너비 조절" onmousedown="startResize(event,'graph')" onkeydown="resizeByKey(event,'graph')"></button></span><span>커밋 메시지<button type="button" class="col-resizer" aria-label="커밋 메시지 열 너비 조절" onmousedown="startResize(event,'date')" onkeydown="resizeByKey(event,'date')"></button></span><span class="date">날짜</span></div><div class="graph-body" style="max-height:455px;overflow-y:auto">${rows.length?drawGraph(rows):''}${rows.map((c,i)=>`<article class="commit-row ${selected.has(c.id)?'selected':''} ${c.id===activeId?'current':''}" data-commit="${c.id}" data-od-id="commit-${c.id}" oncontextmenu="openCommitMenu(event,'${c.id}')"><label class="check-wrap"><input type="checkbox" aria-label="${esc(c.title)} 선택" ${selected.has(c.id)?'checked':''} ${view!=='compare'||!sourceIds.has(c.id)||c.parents.length>1||commits.some(x=>reachable(refs[target]).has(x.id)&&x.origin===c.id)?'disabled':''} onchange="toggleCommit('${c.id}',this.checked)"></label><span></span><button class="commit-open" onclick="showCommit('${c.id}')" oncontextmenu="openCommitMenu(event,'${c.id}')" title="${esc(c.title)}"><span class="commit-title">${esc(c.title)}</span><span class="commit-meta"><span>${esc(c.author)}</span>${Object.entries(refs).filter(([b,id])=>id===c.id).map(([b])=>`<span class="branch-tag">${esc(b)}</span>`).join('')}${c.parents.length>1?'<span>병합</span>':''}${realMode&&c.signature&&c.signature!=='N'?`<span class="branch-tag" title="${esc(sigLabel(c.signature))}${c.signer?' · '+esc(c.signer):''}">${c.signature==='G'?'서명 확인됨':'서명 확인 불가'}</span>`:''}</span></button><span class="date">${fullDateTime(c)}</span></article>`).join('')}${!rows.length?'<div class="empty"><strong>일치하는 커밋이 없습니다</strong>검색어를 바꾸거나 필터를 초기화해 주세요.</div>':''}</div><div class="result-meta" style="padding-top:10px"><span>실선: 직접 부모 · 점선: 숨겨진 조상 경로 · 우클릭으로 SHA 확인</span><span>예제 커밋 그래프</span></div>`;}renderTray();renderDetail();}
const ROW_H=32;
function drawGraph(rows){const pos=new Map(rows.map((c,i)=>[c.id,i])),shown=new Set(pos.keys()),height=rows.length*ROW_H,half=ROW_H/2,xx=c=>[16,44,72][c.lane%3],colors=['var(--fg)','var(--accent)','var(--muted)'];let edges='',nodes='';for(const c of rows){const x=xx(c),y=pos.get(c.id)*ROW_H+half;for(const p of visibleParents(c.id,shown)){const parent=rows[pos.get(p.id)],px=xx(parent),py=pos.get(p.id)*ROW_H+half;edges+=`<path d="M${x} ${y} C${x} ${y+half} ${px} ${py-half} ${px} ${py}" stroke="${colors[c.lane%3]}" stroke-width="1.8" fill="none" ${p.hidden?'stroke-dasharray="3 4"':''}/>`;}nodes+=`<circle cx="${x}" cy="${y}" r="${c.parents.length>1?4.5:3.6}" fill="${colors[c.lane%3]}" stroke="var(--surface)" stroke-width="1.6"/>`;}return `<svg class="graph-canvas" viewBox="0 0 90 ${height}" style="height:${height}px" preserveAspectRatio="none" role="img" aria-label="커밋의 부모 관계 그래프. 점선은 숨겨진 조상을 거치는 연결입니다.">${edges}${nodes}</svg>`;}
function toggleCommit(id,on){if(on)selected.add(id);else selected.delete(id);document.querySelector(`[data-commit="${id}"]`).classList.toggle('selected',on);renderTray();}
function renderTray(){if(view!=='compare'){$('apply-tray').innerHTML=`<span class="detail-note" style="margin:0">브랜치 선택은 조회 범위만 바꿉니다. 작업 브랜치는 그대로 유지됩니다.</span><button class="btn btn-secondary" onclick="const b=viewBranch||branch;source=b;target=b==='main'?'feature/branch-filter':'main';switchView('compare')">비교하기</button>`;return;}$('apply-tray').innerHTML=`<div><strong>${selected.size?selected.size+'개 커밋 선택':'가져올 커밋을 선택하세요'}</strong><small>${selected.size?esc(target)+'에 새 커밋으로 적용':'가져올 브랜치의 일반 커밋을 선택할 수 있습니다.'}</small></div><button class="btn btn-primary" data-od-id="cherry-pick-button" ${!selected.size||source===target?'disabled':''} onclick="openApply()">선택 커밋 가져오기 <span aria-hidden="true">→</span></button>`;}
function renderDetail(){if(!$('commit-detail'))return;const c=commits.find(c=>c.id===activeId);if(!c){$('commit-detail').innerHTML='<div class="empty">커밋을 선택하면 변경 내용을 볼 수 있습니다.</div>';return;}const p=compareRefs(source,target),label=p.common.some(x=>x.id===c.id)?'두 브랜치에 포함':p.source.some(x=>x.id===c.id)?'가져올 브랜치에만':'적용할 브랜치에만';const fileSection=realMode?(()=>{if(commitFilesCache.sha!==c.id&&!commitFilesCache.loading)loadCommitFiles(c.id);const loading=commitFilesCache.sha!==c.id||commitFilesCache.loading;const files=commitFilesCache.sha===c.id?commitFilesCache.files:[];return `<hr class="rule"><p class="detail-sub">변경 파일 <span class="num">${files.length}</span></p>${loading?'<p class="detail-note">불러오는 중...</p>':files.length?files.map((f,i)=>`<button class="file-item" style="width:100%;cursor:pointer" data-od-id="commit-file-${i}" onclick="openFileViewer(${esc(JSON.stringify(c.id))},${esc(JSON.stringify(f.path))})"><span class="file-status">${esc(commitFileStatusLabel(f.status))}</span><span style="overflow-wrap:anywhere">${esc(f.path)}${f.oldPath?` <span class="meta">← ${esc(f.oldPath)}</span>`:''}</span></button>`).join(''):'<p class="detail-note">변경된 파일이 없거나(병합 커밋 등) 조회할 수 없습니다.</p>'}`;})():`<hr class="rule"><p class="detail-sub">변경 파일 <span class="num">1</span></p><div class="file-item"><span class="file-status">M</span><span>${esc(c.file)}</span></div><div class="diff-small" data-od-id="diff-preview"><div style="color:var(--muted)">@@ 변경 내용 미리보기 @@</div><div>− ${esc(c.before)||'빈 파일'}</div><div class="diff-add">+ ${esc(c.after)}</div></div>`;$('commit-detail').innerHTML=`<div class="detail-kicker"><strong>커밋 상세</strong><span class="num">${c.sha}</span></div><h2 data-od-id="commit-detail-title">${esc(c.title)}</h2><div class="person"><span class="avatar">${c.author.slice(0,1)}</span><div>${c.author}<span class="meta">${fullDateTime(c)}</span></div></div><dl><dt>커밋</dt><dd class="num">${c.sha}</dd><dt>부모</dt><dd class="num">${c.parents.map(id=>commits.find(x=>x.id===id)?.sha||id).join(' · ')||'최초 커밋'}</dd><dt>${view==='compare'?'비교 상태':'조회 브랜치'}</dt><dd>${view==='compare'?label:esc(viewBranch||'전체 브랜치')}</dd>${realMode&&c.signature?`<dt>서명</dt><dd>${esc(sigLabel(c.signature)||'서명 없음')}${c.signer?' · '+esc(c.signer):''}</dd>`:''}</dl>${fileSection}<p class="detail-note">${c.parents.length>1?'병합 커밋입니다. 체리픽하려면 기준 부모를 지정해야 하므로 일반 커밋만 선택할 수 있습니다.':'커밋을 가져와도 원본 이력은 유지됩니다. 적용할 브랜치에 새로운 커밋이 생성됩니다.'}</p><button class="btn btn-secondary" style="width:100%" data-od-id="full-diff" onclick="openDiff()">변경 내용 펼쳐보기</button>${realMode?`<div class="row" style="gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn btn-secondary" style="font-size:12px" onclick="revertCommitAction(${esc(JSON.stringify(c.id))})">되돌리기(revert)</button><button class="btn btn-secondary" style="font-size:12px" onclick="resetBranchTo(${esc(JSON.stringify(c.id))},'soft')">Soft 리셋</button><button class="btn btn-secondary" style="font-size:12px" onclick="resetBranchTo(${esc(JSON.stringify(c.id))},'mixed')">Mixed 리셋</button><button class="btn btn-secondary" style="font-size:12px" onclick="resetBranchTo(${esc(JSON.stringify(c.id))},'hard')">Hard 리셋</button></div>`:''}`;}
function modal(title,content){$('modal').innerHTML=`<h2 id="modal-title">${title}</h2>${content}`;if(!$('modal').open)$('modal').showModal();}
function closeModal(){$('modal').close();}
function cancelButton(){return '<button class="btn btn-secondary" onclick="closeModal()">취소</button>';}
async function openDiff(){const c=commits.find(x=>x.id===activeId);if(realMode){modal('변경 내용',`<p class="num">${c.sha}</p><p>불러오는 중...</p>`);const result=await window.gitAPI.showCommit(repoPath,c.id);if(!result.ok){modal('변경 내용',`<p class="num">${c.sha}</p><p>${esc(result.message)}</p><div class="row"><button class="btn btn-secondary" onclick="closeModal()">닫기</button></div>`);return;}modal('변경 내용',`<p class="num">${c.sha}</p><pre class="diff-small" style="font-size:12px;max-height:60vh;overflow:auto;white-space:pre-wrap">${esc(result.value)}</pre><div class="row"><button class="btn btn-secondary" onclick="closeModal()">닫기</button></div>`);return;}modal('변경 내용',`<p class="num">${esc(c.file)} · ${c.sha}</p><div class="diff-small" style="font-size:12px"><div>− ${esc(c.before)||'빈 파일'}</div><div class="diff-add">+ ${esc(c.after)}</div></div><p>예제 데이터의 변경 내용입니다.</p><div class="row"><button class="btn btn-secondary" onclick="closeModal()">닫기</button></div>`);}
function commitFileStatusLabel(status){return {A:'추가',M:'수정',D:'삭제',R:'이름변경',C:'복사',T:'타입변경'}[status]||status;}
async function loadCommitFiles(sha){commitFilesCache={sha,files:[],loading:true};if(view==='graph'||view==='compare')renderDetail();const result=await window.gitAPI.commitFiles(repoPath,sha);commitFilesCache={sha,files:result.ok?result.value:[],loading:false};if(view==='graph'||view==='compare')renderDetail();}
async function openFileViewer(sha,file){fileViewer={sha,file,mode:'diff',loading:true,error:'',diffText:'',fileText:''};render();await loadFileViewerContent();}
async function setFileViewerMode(mode){if(!fileViewer||fileViewer.mode===mode)return;fileViewer.mode=mode;render();await loadFileViewerContent();}
async function loadFileViewerContent(){if(!fileViewer)return;const {sha,file,mode}=fileViewer;fileViewer.loading=true;fileViewer.error='';renderFileViewerPanel();if(mode==='diff'){const result=await window.gitAPI.diffFile(repoPath,file,'commit',sha);if(!fileViewer||fileViewer.sha!==sha||fileViewer.file!==file)return;if(!result.ok){fileViewer.error=result.message;}else{fileViewer.diffText=result.value;}}else{const result=await window.gitAPI.fileAtCommit(repoPath,sha,file);if(!fileViewer||fileViewer.sha!==sha||fileViewer.file!==file)return;if(!result.ok){fileViewer.error='이 커밋에는 해당 파일이 없습니다(삭제되었거나 이름이 바뀌었을 수 있습니다).';}else{fileViewer.fileText=result.value;}}fileViewer.loading=false;renderFileViewerPanel();}
function closeFileViewer(){fileViewer=null;render();}
async function navigateFileViewer(dir){if(!fileViewer)return;const files=commitFilesCache.sha===fileViewer.sha?commitFilesCache.files:[];const idx=files.findIndex(f=>f.path===fileViewer.file);const next=files[idx+dir];if(!next)return;fileViewer={sha:fileViewer.sha,file:next.path,mode:fileViewer.mode,loading:true,error:'',diffText:'',fileText:''};render();await loadFileViewerContent();}
function diffLines(text){if(!text)return '';return text.split('\n').map(l=>`<div class="${l.startsWith('+')&&!l.startsWith('+++')?'diff-add':l.startsWith('-')&&!l.startsWith('---')?'diff-del':''}" style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(l)||' '}</div>`).join('');}
function fileViewerBody(){if(fileViewer.loading)return '<div class="empty">불러오는 중...</div>';if(fileViewer.error)return `<div class="empty"><strong>불러오기 실패</strong>${esc(fileViewer.error)}</div>`;if(fileViewer.mode==='file')return `<pre class="diff-small" style="font-size:12px;max-height:65vh;overflow:auto;white-space:pre-wrap">${esc(fileViewer.fileText)}</pre>`;return `<div class="diff-small" style="font-size:12px;max-height:65vh;overflow:auto">${diffLines(fileViewer.diffText)}</div>`;}
function renderFileViewerPanel(){if(!fileViewer)return;const {sha,file,mode}=fileViewer;const c=commits.find(x=>x.id===sha);const files=commitFilesCache.sha===sha?commitFilesCache.files:[];const idx=files.findIndex(f=>f.path===file);$('view-overlay').innerHTML=heading('파일 보기',`${c?c.sha+' · ':''}${esc(file)}`,`<button class="btn btn-secondary" onclick="closeFileViewer()">← 커밋 이력으로</button>`,'closeFileViewer()')+`<section class="section panel-page" style="padding-top:0" data-od-id="file-viewer"><div class="row-between" style="flex-wrap:wrap;gap:10px;margin-bottom:14px"><div class="row" style="gap:8px"><button class="btn ${mode==='file'?'btn-primary':'btn-secondary'}" onclick="setFileViewerMode('file')">File View</button><button class="btn ${mode==='diff'?'btn-primary':'btn-secondary'}" onclick="setFileViewerMode('diff')">Diff View</button></div><div class="row" style="gap:8px">${files.length>1?`<button class="btn btn-secondary" ${idx<=0?'disabled':''} onclick="navigateFileViewer(-1)">이전 파일</button><span class="meta">${idx+1} / ${files.length}</span><button class="btn btn-secondary" ${idx<0||idx>=files.length-1?'disabled':''} onclick="navigateFileViewer(1)">다음 파일</button>`:''}</div></div><div id="file-viewer-body">${fileViewerBody()}</div></section>`;}
function openApply(){const list=commits.filter(c=>selected.has(c.id)).reverse();modal('선택 커밋 가져오기',`<p><strong>${esc(source)}</strong>에서 <strong>${esc(target)}</strong>으로 아래 순서대로 적용합니다. 원본 커밋은 유지됩니다.</p><ol>${list.map(c=>`<li><span class="num">${c.sha}</span> ${esc(c.title)}</li>`).join('')}</ol><p>${realMode?`${esc(target)}으로 체크아웃한 뒤 실제 git cherry-pick을 순서대로 실행합니다. 충돌이 발생하면 중단하고 알려드립니다.`:'현재는 예제 저장소에만 적용됩니다. 실제 저장소에서는 작업 트리 상태와 충돌 여부를 검사해야 합니다.'}</p><div class="row">${cancelButton()}<button class="btn btn-primary" data-od-id="confirm-cherry-pick" onclick="confirmApply()">${list.length}개 커밋 적용</button></div>`);}
async function confirmApply(){if(realMode){const list=commits.filter(c=>selected.has(c.id)).reverse();closeModal();notify('체크아웃 중...');let result=await window.gitAPI.checkout(repoPath,target);if(!result.ok){notify(result.message);return;}for(const c of list){result=await window.gitAPI.cherryPick(repoPath,c.id);if(!result.ok){await refreshSnapshot();notify(`체리픽 충돌: ${result.message} 터미널에서 파일을 해결한 뒤 계속하거나 git cherry-pick --abort로 되돌리세요.`);selected.clear();return;}}mapSnapshot(result.value);selected.clear();render();notify(`${target}에 ${list.length}개 커밋을 적용했습니다.`);return;}try{const n=pickCommits([...selected],source,target);selected.clear();closeModal();render();notify(`예제 ${target}에 ${n}개 커밋을 적용했습니다.`);}catch(e){notify(e.message);}}
function openFilter(){modal('커밋 필터',`<form onsubmit="event.preventDefault();author=this.elements.author.value;since=this.elements.since.value;selected.clear();closeModal();render()"><div class="field"><label for="filter-author">작성자</label><select class="input" name="author" id="filter-author"><option value="">모든 작성자</option>${[...new Set(commits.map(c=>c.author))].map(a=>`<option ${a===author?'selected':''}>${a}</option>`).join('')}</select></div><div class="field"><label for="filter-since">이 날짜부터</label><input class="input" type="date" name="since" id="filter-since" value="${since}"></div><p>조건에 일치하지 않는 커밋은 행 자체를 숨깁니다. 숨겨진 부모를 거치는 그래프 연결은 점선으로 표시합니다.</p><div class="row"><button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button><button class="btn btn-primary">필터 적용</button></div></form>`);}
function openNewBranch(base){modal('브랜치 만들기',`<form onsubmit="event.preventDefault();createBranch(this)"><div class="field"><label for="branch-name">브랜치 이름</label><input class="input" id="branch-name" name="name" required placeholder="feature/new-work" pattern="[A-Za-z0-9][A-Za-z0-9/_-]*"></div><div class="field"><label for="branch-base">시작 브랜치</label><select class="input" id="branch-base" name="base">${options(base||(realMode?branch:'main'))}</select></div><p id="branch-error" role="alert">예제 저장소 안에 새로운 브랜치를 만듭니다.</p><div class="row"><button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button><button class="btn btn-primary">브랜치 만들기</button></div></form>`);}
async function createBranch(form){const name=form.elements.name.value.trim();const base=form.elements.base.value;if(!realMode&&(refs[name]||name.endsWith('/')||name.includes('//')||name.endsWith('-'))){$('branch-error').textContent='이름이 중복되거나 유효하지 않습니다.';return;}if(realMode){const result=await window.gitAPI.createBranch(repoPath,name,base);closeModal();if(!result.ok){notify(result.message);return;}mapSnapshot(result.value);showBranch(name);notify(`${name} 브랜치를 만들었습니다.`);return;}refs[name]=refs[base];closeModal();showBranch(name);notify('예제 브랜치를 만들었습니다.');}
function workingFileRow(f,staged){const i=wip.findIndex(x=>x.path===f.path);const isActive=realMode&&workingDiffFile===f.path&&workingDiffStaged===staged;return `<article class="log-row ${isActive?'selected':''}" style="padding:8px 6px;cursor:${realMode?'pointer':'default'};border-radius:6px" data-od-id="working-file-${staged?'staged':'unstaged'}-${i}" ${realMode?`onclick="previewWorkingFile(${esc(JSON.stringify(f.path))},${staged})"`:''}><div class="row-between" style="gap:8px"><label class="row" style="gap:8px;min-width:0" onclick="event.stopPropagation()"><input type="checkbox" ${staged?'checked':''} onchange="toggleStage(${i},this.checked)"><span class="num" style="overflow-wrap:anywhere;font-size:12px">${esc(f.path)}</span></label>${f.untracked?'<span class="neutral-tag">신규</span>':''}</div>${realMode?`<div class="row" style="gap:6px;margin-top:6px;flex-wrap:wrap" onclick="event.stopPropagation()"><button class="btn btn-secondary" style="font-size:11px;padding:3px 7px" onclick="openFileEditor(${esc(JSON.stringify(f.path))})">편집</button>${!f.untracked?`<button class="btn btn-secondary" style="font-size:11px;padding:3px 7px" onclick="openHunkView(${esc(JSON.stringify(f.path))})">부분 스테이징</button><button class="btn btn-secondary" style="font-size:11px;padding:3px 7px" onclick="untrackFileAction(${esc(JSON.stringify(f.path))})">추적 중단</button>`:`<button class="btn btn-secondary" style="font-size:11px;padding:3px 7px" onclick="ignoreFileAction(${esc(JSON.stringify(f.path))})">무시하기</button><button class="btn btn-secondary" style="font-size:11px;padding:3px 7px" onclick="deleteWorkingFileAction(${esc(JSON.stringify(f.path))})">파일 삭제</button>`}</div>`:''}</article>`;}

">커밋 비교</button><button class="btn btn-secondary" onclick="openExternalLink(${esc(JSON.stringify(pr.url))})">GitHub에서 열기</button></div></article>`;}).join(''):'<div class="empty">열려 있는 PR이 없습니다.</div>'}`}<p class="detail-note">실제 GitHub REST API 읽기 전용 조회입니다. PR 생성·리뷰·병합 실행은 이후 단계에서 지원 예정입니다.</p></section>`;}

function renderWorktrees(){if(realMode){$('view-overlay').innerHTML=heading('워크트리','하나의 저장소에서 여러 브랜치를 독립적인 작업 디렉터리로 관리하세요.',`<button class="btn btn-secondary" data-od-id="add-worktree" onclick="openAddWorktree()">${icon('worktrees')} 워크트리 추가</button>`)+`<section class="section panel-page" style="padding-top:0" data-od-id="worktree-list"><div class="grid-2">${realWorktrees.map((w,i)=>`<article class="card" data-od-id="worktree-${i}"><span class="neutral-tag">${w.path===repoPath?'현재 워크트리':w.locked?'잠김':w.bare?'bare':'워크트리'}</span><h2 style="overflow-wrap:anywhere">${esc(w.branch||(w.detached?'(detached HEAD)':'-'))}</h2><p class="num" style="overflow-wrap:anywhere">${(w.head||'').slice(0,10)}</p><p class="meta" style="overflow-wrap:anywhere">${esc(w.path)}</p>${w.locked&&w.lockReason?`<p class="detail-note">${esc(w.lockReason)}</p>`:''}<div class="row" style="gap:8px;margin-top:20px;flex-wrap:wrap">${w.branch?`<button class="btn btn-secondary" onclick="showBranch(${esc(JSON.stringify(w.branch))})">이력 보기</button>`:''}${w.path!==repoPath?`<button class="btn btn-secondary" onclick="${w.locked?'unlockWorktreeAction':'lockWorktreeAction'}(${esc(JSON.stringify(w.path))})">${w.locked?'잠금 해제':'잠금'}</button><button class="btn btn-secondary" onclick="removeWorktreeAction(${esc(JSON.stringify(w.path))})" ${w.locked?'disabled':''}>제거</button>`:''}</div></article>`).join('')}</div><p class="detail-note">사용 중이거나 잠긴 워크트리의 브랜치는 실제 Git이 삭제·재체크아웃을 막습니다.</p></section>`;return;}$('view-overlay').innerHTML=heading('워크트리','하나의 저장소에서 여러 브랜치를 독립적인 디렉터리로 관리하세요.')+`<section class="section panel-page" style="padding-top:0" data-od-id="worktree-list"><div class="grid-2">${worktrees.map((w,i)=>`<article class="card" data-od-id="worktree-${i}"><span class="neutral-tag">예제 작업 디렉터리</span><h2>${w.name}</h2><p class="num" style="overflow-wrap:anywhere">${esc(w.branch)}</p><p class="meta" style="overflow-wrap:anywhere">${esc(w.path)}</p><button class="btn btn-secondary" style="margin-top:20px" onclick= function renderSubmodules(){if(!realMode)return;const labels={clean:'정상',uninitialized:'초기화 필요',modified:'포인터 변경됨',conflict:'충돌'};$('view-overlay').innerHTML=heading('서브모듈','다른 Git 저장소를 하위 디렉터리로 포함해 관리하세요.',`<button class="btn btn-secondary" data-od-id="add-submodule" onclick="openAddSubmodule()">${icon('branch')} 서브모듈 추가</button>`)+`<section class="section panel-page" style="padding-top:0" data-od-id="submodule-list">${submodulesList.length?`<div class="grid-2">${submodulesList.map((s,i)=>`<article class="card" data-od-id="submodule-${i}"><span class="neutral-tag">${labels[s.status]||s.status}</span><h2 style="overflow-wrap:anywhere">${esc(s.path)}</h2><p class="num" style="overflow-wrap:anywhere">${s.sha.slice(0,10)}</p><p class="meta" style="overflow-wrap:anywhere">${esc(s.url||'URL 확인 불가')}</p><div class="row" style="gap:8px;margin-top:20px;flex-wrap:wrap"><button class="btn btn-secondary" onclick="updateSubmoduleAction(${esc(JSON.stringify(s.path))})">${s.status==='uninitialized'?'초기화 + 업데이트':'업데이트'}</button><button class="btn btn-secondary" onclick="deinitSubmoduleAction(${esc(JSON.stringify(s.path))})">비활성화</button></div></article>`).join('')}</div>`:'<div class="empty"><strong>등록된 서브모듈이 없습니다</strong>서브모듈 추가 버튼으로 다른 저장소를 포함해 보세요.</div>'}<p class="detail-note">서브모듈 추가·업데이트는 실제 네트워크로 원격 저장소를 clone·fetch합니다.</p></section>`;}

function renderFileHistory(){if(!realMode)return;$('view-overlay').innerHTML=heading('파일 이력','파일 경로를 입력하면 실제 git log --follow 이력과 줄별 blame을 보여줍니다.')+`<section class="section panel-page" style="padding-top:0" data-od-id="file-history"><form class="row" style="gap:8px;margin-bottom:16px" onsubmit="event.preventDefault();fileHistoryPath=this.elements.path.value.trim();loadFileHistory()"><input class="input" name="path" placeholder="예: src/app.js" value="${esc(fileHistoryPath)}" style="flex:1"><button class="btn btn-primary">조회</button></form>${!fileHistoryPath?'<div class="empty"><strong>조회할 파일 경로를 입력하세요</strong>저장소 최상위 기준 상대 경로입니다.</div>':fileHistoryError?`<div class="empty"><strong>불러오기 실패</strong>${esc(fileHistoryError)}</div>`:!fileHistoryLoaded?'<div class="empty">불러오는 중...</div>':`<p class="detail-sub">커밋 이력 <span class="num">${fileHistoryCommits.length}</span></p>${fileHistoryCommits.map((c,i)=>`<article class="log-row" data-od-id="file-history-${i}"><div><div class="row" style="gap:8px;margin-bottom:6px"><span class="num">${esc(c.shortSha)}</span><span class="meta">${esc(c.date)} ${esc(c.time)}</span></div><p style="margin:0">${esc(c.subject)}</p><p class="meta" style="margin:4px 0 0">${esc(c.author)}</p></div></article>`).join('')}<hr class="rule"><p class="detail-sub">줄별 작성자(blame) · HEAD 기준</p><div class="diff-small" style="font-size:11px;max-height:50vh">${fileHistoryBlame.map(b=>`<div style="display:flex;gap:10px;white-space:pre" title="${esc(b.shortSha)} · ${esc(b.author)} · ${esc(b.summary)}"><span class="num" style="width:60px;flex-shrink:0">${esc(b.shortSha)}</span><span class="meta" style="width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis">${esc(b.author)}</span><span style="width:40px;flex-shrink:0;color:var(--muted)">${b.line}</span><span style="overflow-wrap:anywhere">${esc(b.content)}</span></div>`).join('')}</div>`}</section>`;}
async function loadFileHistory(){if(!fileHistoryPath){render();return;}fileHistoryLoaded=false;fileHistoryError='';render();const [histResult,blameResult]=await Promise.all([window.gitAPI.fileHistory(repoPath,fileHistoryPath),window.gitAPI.blame(repoPath,fileHistoryPath)]);fileHistoryLoaded=true;if(!histResult.ok){fileHistoryError=histResult.message;render();return;}fileHistoryCommits=histResult.value;fileHistoryBlame=blameResult.ok?blameResult.value:[];render();}
function renderTerminal(){if(!realMode)return;$('view-overlay').innerHTML=heading('터미널','저장소 작업 디렉터리에서 실제 셸 세션을 실행합니다.',terminalId?`<button class="btn btn-secondary" onclick="killTerminal()">세션 종료</button>`:`<button class="btn btn-primary" onclick="startTerminal()" ${window.terminalAPI?'':'disabled'}>세션 시작</button>`)+`<section class="section panel-page" style="padding-top:0" data-od-id="terminal-panel"><div class="diff-small" id="terminal-output" style="font-size:12px;min-height:360px;max-height:60vh;white-space:pre-wrap;padding:12px">${terminalLines.map(esc).join('')}</div><form class="row" style="gap:8px;margin-top:12px" onsubmit="event.preventDefault();sendTerminalInput(this)"><input class="input" name="cmd" style="flex:1;font-family:var(--font-mono)" placeholder="${terminalId?'명령어 입력 후 Enter':'먼저 세션을 시작하세요'}" ${terminalId?'':'disabled'} autocomplete="off"><button class="btn btn-secondary" ${terminalId?'':'disabled'}>실행</button></form><p class="detail-note">${window.terminalAPI?`작업 경로: ${esc(repoPath)} · ANSI 색상·vim 등 전체 화면 프로그램은 지원하지 않으며 일반 명령 출력만 표시됩니다.`:'Electron 앱에서 실행해야 터미널을 사용할 수 있습니다.'}</p></section>`;const out=$('terminal-output');if(out)out.scrollTop=out.scrollHeight;}
async function startTerminal(){if(!realMode||!window.terminalAPI)return;terminalLines=[];let id;try{id=await window.terminalAPI.start(repoPath);}catch(e){notify(e.message||'터미널 시작에 실패했습니다.');return;}terminalId=id;terminalUnsub.push(window.terminalAPI.onData(id,data=>{terminalLines.push(data);if(terminalLines.length>2000)terminalLines=terminalLines.slice(-2000);if(view==='terminal')renderTerminal();}));terminalUnsub.push(window.terminalAPI.onExit(id,code=>{terminalLines.push(`\n[프로세스 종료: 코드 ${code}]\n`);terminalId=null;if(view==='terminal')renderTerminal();}));render();}

function cleanupTerminal(){terminalUnsub.forEach(fn=>fn&&fn());terminalUnsub=[];terminalId=null;}
async function endTerminalSession(){if(terminalId&&window.terminalAPI){try{await window.terminalAPI.kill(terminalId);}catch{}}cleanupTerminal();terminalLines=[];}
async function sendTerminalInput(form){const cmd=form.elements.cmd.value;form.elements.cmd.value='';if(!terminalId)return;terminalLines.push(`$ ${cmd}\n`);try{await window.terminalAPI.input(terminalId,cmd+'\n');}catch(e){notify(e.message||'입력 전송에 실패했습니다.');}renderTerminal();}
function openStash(index){modal('임시 저장한 변경',`<p>${esc(stashes[index].title)}</p><p>${realMode?'선택한 스태시를 적용합니다. 충돌 시 원본 스태시 항목은 유지됩니다.':'예제 작업 변경 목록에 복원합니다. 스태시 항목은 유지됩니다.'}</p><div class="row">${cancelButton()}<button class="btn btn-primary" onclick="restoreStash(${index})">변경 복원</button></div>`);}
async function restoreStash(index){if(realMode){const result=await window.gitAPI.stashApply(repoPath,stashes[index].ref);closeModal();if(!result.ok){notify(result.message);return;}mapSnapshot(result.value);switchView('changes');notify('스태시를 적용했습니다.');return;}const files=stashes[index].files;if(files.some(f=>wip.some(w=>w.path===f.path))){notify('같은 경로의 작업 변경이 있어 복원을 중단했습니다.');return;}wip.push(...structuredClone(files).map(f=>({...f,staged:false})));closeModal();switchView('changes');notify('예제 변경을 복원했습니다.');}
function syncHeader(){$('repo-tab-name').textContent=realMode?repoName:'branchline-desktop';$('repo-tab-tag').textContent=realMode?'실제 저장소':'예제 저장소';$('repo-mode-note').textContent=realMode?repoPath:'로컬 작업 공간';$('head-branch').textContent=branch;$('status-scope').textContent=realMode?`${repoPath} · 실제 Git CLI로 동작합니다`:'실제 Git 및 원격 서버에 연결되지 않은 프로토타입';$('primary-actions').innerHTML=(realMode?`<button class="toolbar-btn" data-od-id="fetch-button" onclick="openFetchMenu(event)">${icon('fetch')}<span>Fetch ▾</span></button><button class="toolbar-btn" data-od-id="push-button" onclick="pushRepo()">${icon('push')}<span>Push</span></button><span class="toolbar-divider"></span>`:'')+`<button class="toolbar-btn" data-od-id="new-branch-toolbar" onclick="openNewBranch()">${icon('branch')}<span>Branch</span></button><button class="toolbar-btn" data-od-id="stash-save-toolbar" onclick="stashSaveAction()" ${wip.length?'':'disabled'}>${icon('stash')}<span>Stash</span></button><button class="toolbar-btn" data-od-id="stash-pop-toolbar" onclick="quickStashPop()" ${stashes.length?'':'disabled'}>${icon('pop')}<span>Pop</span></button>`+(realMode?`<span class="toolbar-divider"></span><button class="toolbar-btn" data-od-id="gitflow-toolbar" onclick="openGitflowMenu()">${icon('branch')}<span>Gitflow</span></button><button class="toolbar-btn" data-od-id="terminal-toolbar" onclick="switchView('terminal')">${icon('terminal')}<span>Terminal</span></button>`:'');renderRepoTabs();}
function renderRepoTabs(){const el=$('repo-tab-strip');el.hidden=false;el.innerHTML=openRepos.map((r,i)=>`<button class="btn ${realMode&&r.path===repoPath?'btn-primary':'btn-secondary'}" data-od-id="repo-tab-${i}" style="font-size:11px;padding:6px 10px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap" onclick="switchRepoTab(${esc(JSON.stringify(r.path))})">${esc(r.name)}<span onclick="closeRepoTab(${esc(JSON.stringify(r.path))},event)" style="opacity:.65" title="탭 닫기">✕</span></button>`).join('')+`<button class="btn btn-secondary" data-od-id="open-repo-button" onclick="openRepoMenu()" style="font-size:11px;padding:6px 10px" title="저장소 열기 · 새로 만들기 · 복제" aria-label="저장소 열기">+ 저장소 열기</button>`;}
function loadOpenRepos(){try{const raw=localStorage.getItem('branchline-open-repos');openRepos=raw?JSON.parse(raw):[];}catch{openRepos=[];}}

function renderNotes(){const noteBranch=viewBranch||branch;const text=branchNoteFor(noteBranch);$('view-overlay').innerHTML=heading('내 메모',`${esc(noteBranch)} 브랜치에만 보이는 개인 메모입니다. 이 브랜치를 사용하는 다른 사람에게는 공유되지 않습니다.`)+`<section class="section panel-page" data-od-id="branch-notes"><div class="row-between"><h2 style="margin:0">${esc(noteBranch)}</h2><span class="meta" id="note-save-state">${text?'저장됨':'메모 없음'}</span></div><textarea class="textarea" id="branch-note-input" style="min-height:320px;margin-top:14px" placeholder="이 브랜치에 대한 메모, 다음 할 일, 리뷰 코멘트 등을 자유롭게 적어보세요." oninput="onBranchNoteInput(this.value)">${esc(text)}</textarea><p class="detail-note" style="margin-top:10px">입력하면 자동으로 브라우저에 저장됩니다. 다른 저장소 탭이나 브랜치로 전환해도 각각 독립적으로 보관됩니다.</p></section>`;}
let branchNoteTimer=null;

async function switchRepoTab(path){if(realMode&&path===repoPath)return;fileViewer=null;workingDiffFile=null;commitFilesCache={sha:null,files:[],loading:false};await endTerminalSession();notify('저장소를 여는 중...');const result=await window.gitAPI.snapshot(path);if(!result.ok){notify(result.message);openRepos=openRepos.filter(r=>r.path!==path);saveOpenRepos();render();return;}await applyResult(result,`${result.value?.name||'저장소'}로 전환했습니다.`);addOpenRepo(result.value.path,result.value.name);await loadSigningConfig();await detectGithubRemote();}

function laneFor(id,order,reachSets){for(let i=0;i<order.length;i++)if(reachSets[i].has(id))return i;return 0;}
function mapSnapshot(snap){const prevRepoPath=repoPath;const names=Object.keys(snap.refs);const order=[...names].sort((a,b)=>(a==='main'||a==='master')?-1:(b==='main'||b==='master')?1:0);const rows=snap.commits.map(c=>({...c}));const reachSets=order.map(name=>reachable(snap.refs[name],rows));for(const c of rows)c.lane=laneFor(c.id,order,reachSets)%3;commits=rows;refs=snap.refs;const byPath=new Map();for(const f of snap.files){const cur=byPath.get(f.path)||{path:f.path,hasStaged:false,hasUnstaged:false,untracked:false};if(f.status==='?')cur.untracked=true;if(f.staged)cur.hasStaged=true;else cur.hasUnstaged=true;byPath.set(f.path,cur);}wip=[...byPath.values()].map(f=>({...f,staged:f.hasStaged}));stashes=snap.stashes.map(s=>({ref:s.ref,title:s.title,files:[]}));remotesList=snap.remotes;tagsList=snap.tags;repoName=snap.name;repoPath=snap.path;realMode=true;branch=snap.head||order[0]||branch;if(prevRepoPath!==snap.path)viewBranch=null;else if(viewBranch&&!refs[viewBranch])viewBranch=null;if(!refs[source])source=order.find(n=>n!==branch)||branch;if(!refs[target])target=branch;selected.clear();fileMode=false;operation=snap.operation||null;conflicts=snap.conflicts||[];realWorktrees=snap.worktrees||[];submodulesList=snap.submodules||[];lfsInfo=snap.lfs||null;}

async function ensureDevelop(){const existing=developBranchName();if(existing)return existing;const base=defaultBranchName();if(!base){notify('기본 브랜치를 찾을 수 없습니다.');return null;}if(!confirm(`develop 브랜치가 없습니다. ${base}에서 develop을 만들까요?`))return null;const result=await window.gitAPI.createBranch(repoPath,'develop',refs[base]);if(!result.ok){notify(result.message);return null;}mapSnapshot(result.value);render();return 'develop';}
function gitflowStartPrompt(kind){const label={feature:'Feature',release:'Release',hotfix:'Hotfix'}[kind];modal(`${label} 시작`,`<form onsubmit="event.preventDefault();gitflowStart('${kind}',this.elements.name.value.trim())"><div class="field"><label for="gitflow-name">이름${kind==='release'?' (예: 1.2.0)':''}</label><input id="gitflow-name" class="input" name="name" required autofocus placeholder="${kind==='release'?'1.2.0':'my-feature'}"></div><div class="row" style="margin-top:16px;gap:8px"><button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button><button class="btn btn-primary">시작</button></div></form>`);}
async function gitflowStart(kind,name){if(!name){closeModal();return;}closeModal();if(!/^[\w.\-]+$/.test(name)){notify('브랜치 이름에는 영문·숫자·.·-·_만 사용할 수 있습니다.');return;}const base=kind==='feature'?await ensureDevelop():defaultBranchName();if(!base)return;const branchName=`${kind}/${name}`;if(refs[branchName]){notify(`${branchName} 브랜치가 이미 있습니다.`);return;}const result=await window.gitAPI.createBranch(repoPath,branchName,refs[base]);if(!result.ok){notify(result.message);return;}const checkoutResult=await window.gitAPI.checkout(repoPath,branchName);if(!checkoutResult.ok){notify(checkoutResult.message);return;}mapSnapshot(checkoutResult.value);render();notify(`${branchName}을(를) ${base}에서 만들고 체크아웃했습니다.`);}
function gitflowFinishPrompt(kind){const label={feature:'Feature',release:'Release',hotfix:'Hotfix'}[kind];const list=gitflowBranchesWithPrefix(kind);if(!list.length){notify(`진행 중인 ${label} 브랜치가 없습니다.`);return;}modal(`${label} 완료`,`<form onsubmit="event.preventDefault();gitflowFinish('${kind}',this.elements.branch.value,this.elements.tag?this.elements.tag.value.trim():'')"><div class="field"><label for="gitflow-finish-branch">완료할 ${label} 브랜치</label><select id="gitflow-finish-branch" class="input" name="branch">${list.map(b=>`<option value="${esc(b)}">${esc(b)}</option>`).join('')}</select></div>${kind!=='feature'?`<div class="field" style="margin-top:12px"><label for="gitflow-tag">태그 이름 · 선택</label><input id="gitflow-tag" class="input" name="tag" placeholder="v1.2.0"></div>`:''}<p class="detail-note" style="margin-top:12px">${kind==='feature'?'develop으로 no-ff 병합 후 브랜치를 삭제합니다.':'main과 develop 모두에 no-ff 병합하고, 태그를 입력하면 main에 태그를 만든 뒤 브랜치를 삭제합니다.'}</p><div class="row" style="margin-top:16px;gap:8px"><button type="button" class="btn btn-secondary" onclick="closeModal()">취소</button><button class="btn btn-primary">완료</button></div></form>`);}
async function gitflowMergeInto(branchName,target,deleteAfter){const checkoutResult=await window.gitAPI.checkout(repoPath,target);if(!checkoutResult.ok){notify(checkoutResult.message);return false;}mapSnapshot(checkoutResult.value);const mergeResult=await window.gitAPI.merge(repoPath,branchName,'no-ff');if(!mergeResult.ok){await refreshSnapshot();notify(`${target}에 병합 중 충돌: ${mergeResult.message} 충돌을 해결한 뒤 다시 완료를 진행해 주세요.`);render();return false;}mapSnapshot(mergeResult.value);if(deleteAfter){const delResult=await window.gitAPI.deleteBranch(repoPath,branchName,false);if(delResult.ok)mapSnapshot(delResult.value);else notify(delResult.message);}render();return true;}
async function gitflowFinish(kind,branchName,tagName){closeModal();if(!realMode||operation)return;if(!refs[branchName]){notify(`${branchName} 브랜치를 찾을 수 없습니다.`);return;}if(kind==='feature'){const develop=developBranchName();if(!develop){notify('develop 브랜치가 없습니다.');return;}const ok=await gitflowMergeInto(branchName,develop,true);if(ok)notify(`${branchName}을(를) ${develop}에 완료했습니다.`);return;}const main=defaultBranchName();const develop=developBranchName();if(!main||!develop){notify('main과 develop 브랜치가 모두 있어야 합니다.');return;}const ok1=await gitflowMergeInto(branchName,main,false);if(!ok1)return;if(tagName){const tagResult=await window.gitAPI.tagCreate(repoPath,tagName,refs[main],`${kind==='release'?'Release':'Hotfix'} ${tagName}`,false);if(!tagResult.ok){notify(tagResult.message);return;}mapSnapshot(tagResult.value);render();}const ok2=await gitflowMergeInto(branchName,develop,true);if(!ok2)return;notify(`${branchName}을(를) ${main}${tagName?`(태그 ${tagName})`:''}·${develop}에 완료했습니다.`);}
async function mergeBranch(name){if(!realMode||operation)return;notify('병합 중...');const result=await window.gitAPI.merge(repoPath,name);if(!result.ok){await refreshSnapshot();notify(`병합 충돌: ${result.message}`);return;}mapSnapshot(result.value);render();notify(`${name}을(를) ${branch}에 병합했습니다.`);}
async function rebaseOnto(name){if(!realMode||operation)return;notify('리베이스 중...');const result=await window.gitAPI.rebase(repoPath,name);if(!result.ok){await refreshSnapshot();notify(`리베이스 충돌: ${result.message}`);return;}mapSnapshot(result.value);render();notify(`${branch}을(를) ${name} 위로 리베이스했습니다.`);}
const REBASE_ACTION_LABELS={pick:'적용(pick)',reword:'메시지 수정(reword)',squash:'병합(squash)',fixup:'병합·메시지 버림(fixup)',drop:'제외(drop)'};

function rebasePlanRow(item,i){return `<div class="log-row" data-od-id="rebase-plan-${i}" style="padding:10px 12px"><div class="row-between" style="gap:8px"><div class="row" style="gap:6px"><button class="btn btn-secondary" style="font-size:11px;padding:2px 8px" ${i===0?'disabled':''} onclick="moveRebaseItem(${i},-1)">▲</button><button class="btn btn-secondary" style="font-size:11px;padding:2px 8px" ${i===rebasePlan.length-1?'disabled':''} onclick="moveRebaseItem(${i},1)">▼</button><span class="num">${esc(item.shortSha)}</span><span style="font-size:13px">${esc(item.subject)}</span></div><select class="input" style="width:auto" onchange="setRebaseAction(${i},this.value)">${Object.entries(REBASE_ACTION_LABELS).map(([v,l])=>`<option value="${v}" ${item.action===v?'selected':''}>${l}</option>`).join('')}</select></div>${item.action==='reword'?`<input class="input" style="margin-top:8px" value="${esc(item.message)}" oninput="setRebaseMessage(${i},this.value)" placeholder="새 커밋 메시지">`:''}</div>`;}
function renderRebasePlanModal(){modal('인터랙티브 리베이스',`<p class="detail-note">기준 브랜치: <span class="num">${esc(rebasePlanBase)}</span> · 오래된 순으로 표시됩니다.</p><div id="rebase-plan-list">${rebasePlan.map((item,i)=>rebasePlanRow(item,i)).join('')}</div><p class="detail-note">첫 번째 커밋은 pick 또는 reword만 가능합니다. squash/fixup은 바로 위 커밋에 합쳐집니다.</p><div class="row" style="margin-top:12px;gap:8px"><button class="btn btn-secondary" onclick="closeModal()">취소</button><button class="btn btn-primary" onclick="submitInteractiveRebase()">리베이스 실행</button></div>`);}
function moveRebaseItem(i,dir){const j=i+dir;if(j<0||j>=rebasePlan.length)return;[rebasePlan[i],rebasePlan[j]]=[rebasePlan[j],rebasePlan[i]];renderRebasePlanModal();}
function setRebaseAction(i,value){rebasePlan[i].action=value;renderRebasePlanModal();}

async function submitInteractiveRebase(){if((rebasePlan[0].action==='squash'||rebasePlan[0].action==='fixup')){notify('첫 번째 커밋은 squash/fixup으로 지정할 수 없습니다.');return;}closeModal();notify('인터랙티브 리베이스 실행 중...');const plan=rebasePlan.map(({sha,action,message})=>({sha,action,message}));const result=await window.gitAPI.interactiveRebase(repoPath,rebasePlanBase,plan);if(!result.ok){await refreshSnapshot();notify(`리베이스 실패: ${result.message}`);return;}mapSnapshot(result.value);render();notify('인터랙티브 리베이스를 완료했습니다.');}
async function resolveConflictFile(file,strategy){const result=await window.gitAPI.resolveConflict(repoPath,file,strategy);if(!result.ok){notify(result.message);return;}mapSnapshot(result.value);render();notify(`${file}을(를) ${strategy==='ours'?'현재 쪽':'가져오는 쪽'} 내용으로 해결했습니다.`);}
async function continueOp(){const result=await window.gitAPI.continueOperation(repoPath,operation);if(!result.ok){notify(result.message);return;}mapSnapshot(result.value);render();notify('작업을 계속 진행했습니다.');}

function renderConflictBanner(){const el=$('conflict-banner');if(!realMode||!operation){el.hidden=true;el.innerHTML='';return;}el.hidden=false;const label={merge:'병합',rebase:'리베이스','cherry-pick':'체리픽',revert:'되돌리기'}[operation]||operation;const remaining=conflicts.length;el.innerHTML=`<div style="background:var(--surface);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;flex-direction:column;gap:10px"><div class="row-between"><strong>${label} 충돌 · ${remaining}개 파일</strong><div class="row" style="gap:8px"><button class="btn btn-secondary" onclick="abortOp()">중단하고 되돌리기</button><button class="btn btn-primary" ${remaining?'disabled':''} onclick="continueOp()">${label} 계속하기</button></div></div>${remaining?conflicts.map(f=>`<div class="row-between" style="font-size:13px"><span class="num" style="overflow-wrap:anywhere">${esc(f)}</span><div class="row" style="gap:6px"><button class="btn btn-secondary" style="font-size:11px;padding:4px 8px" onclick="resolveConflictFile(${esc(JSON.stringify(f))},'ours')">현재 쪽 사용</button><button class="btn btn-secondary" style="font-size:11px;padding:4px 8px" onclick="resolveConflictFile(${esc(JSON.stringify(f))},'theirs')">가져오는 쪽 사용</button></div></div>`).join(''):'<p class="detail-note" style="margin:0">모든 충돌을 해결했습니다. 계속하기를 눌러 완료하세요.</p>'}</div>`;}

function identityFormHtml(cfg){return `<h2 style="margin-top:0">Git 사용자 정보</h2><p class="detail-note">이 저장소에서 만드는 커밋의 작성자 정보입니다. 저장소 전용 값을 비워두면 전역 설정(${esc(cfg.globalName||'미설정')} · ${esc(cfg.globalEmail||'미설정')})을 사용합니다.</p><form onsubmit="event.preventDefault();saveIdentity(this.elements.name.value.trim(),this.elements.email.value.trim(),this.elements.scope.value)"><div class="field"><label for="identity-name">이름</label><input id="identity-name" class="input" name="name" value="${esc(cfg.localName||cfg.globalName)}"></div><div class="field" style="margin-top:12px"><label for="identity-email">이메일</label><input id="identity-email" class="input" name="email" type="email" value="${esc(cfg.localEmail||cfg.globalEmail)}"></div><div class="field" style="margin-top:12px"><label for="identity-scope">적용 범위</label><select id="identity-scope" class="input" name="scope"><option value="local">이 저장소만</option><option value="global">전역(모든 저장소)</option></select></div><div class="row" style="margin-top:14px;gap:8px">${cfg.localName||cfg.localEmail?`<button type="button" class="btn btn-ghost" onclick="clearLocalIdentity()">저장소 전용 값 지우기</button>`:''}<button class="btn btn-primary">저장</button></div></form>`;}

function renderLfsSection(){if(!lfsInfo)return '';if(!lfsInfo.available)return `<hr class="rule"><p class="detail-sub">Git LFS</p><p class="detail-note">이 시스템에 git-lfs가 설치되어 있지 않아 사용할 수 없습니다.</p>`;return `<hr class="rule"><p class="detail-sub">Git LFS</p>${lfsInfo.installed?'<p class="detail-note">이 저장소에 Git LFS가 설치되어 있습니다.</p>':`<button class="btn btn-secondary" onclick="installLfs()">이 저장소에 Git LFS 설치</button>`}<div class="field" style="margin-top:12px"><label for="lfs-pattern">추적 패턴 추가</label><div class="row" style="gap:8px"><input class="input" id="lfs-pattern" placeholder="*.psd"><button class="btn btn-secondary" onclick="trackLfsPattern()">추가</button></div></div>${lfsInfo.patterns.length?`<div class="stack" style="gap:4px;margin-top:8px">${lfsInfo.patterns.map(p=>`<div class="row-between" style="font-size:12px"><span class="num">${esc(p)}</span><button class="btn btn-secondary" style="font-size:11px;padding:4px 8px" onclick="untrackLfsPattern(${esc(JSON.stringify(p))})">해제</button></div>`).join('')}</div>`:'<p class="detail-note">추적 중인 패턴이 없습니다.</p>'}${lfsInfo.files.length?`<p class="detail-note">LFS 관리 파일 ${lfsInfo.files.length}개 · 실제 내용 다운로드됨 ${lfsInfo.files.filter(f=>f.downloaded).length}개</p>`:''}`;}

let colWidths={graph:90,date:170};
