<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Branchline — 폼 &amp; 테이블</title>
<link rel="stylesheet" href="../colors_and_type.css" />
<link rel="stylesheet" href="../tokens.css" />
<style>
  body { padding: 40px; max-width: 980px; margin: 0 auto; }
  .section-block { margin-top: var(--gap-xl); padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-lg); }
  .field { display: flex; flex-direction: column; gap: 6px; max-width: 340px; }
  .field label { font-size: 13px; color: var(--muted); }
  .input, .textarea { width: 100%; min-height: var(--app-control-h); padding: 11px 14px; border: 1px solid var(--border); border-radius: var(--app-radius); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; }
  .input:focus, .textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; background: var(--accent-soft); color: var(--accent); border-radius: 999px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .tag { display: inline-flex; align-items: center; padding: 4px 10px; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 999px; font-size: 12px; }
  .ds-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
  .ds-table th, .ds-table td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }
  .ds-table th { color: var(--muted); font-weight: 500; font-family: var(--font-mono); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }
  .ds-table tbody tr:hover { background: var(--fg-soft); }
  .num-col { font-family: var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
  .search-wrap { display: flex; align-items: center; gap: 8px; max-width: 320px; padding: 0 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; }
  .search-wrap input { width: 100%; min-height: var(--app-control-h); background: none; border: 0; font-size: 12px; }
</style>
</head>
<body>
  <p class="eyebrow">Preview · Components</p>
  <h1 class="h2">폼, 태그, 데이터 테이블</h1>

  <div class="section-block">
    <div class="field">
      <label for="msg">커밋 메시지</label>
      <input id="msg" class="input" placeholder="브랜치 필터 선택 UI 추가" />
    </div>
    <div class="field" style="margin-top:16px">
      <label for="note">설명</label>
      <textarea id="note" class="textarea" style="min-height:96px;resize:vertical" placeholder="선택한 브랜치의 이력에 집중하도록 필터를 추가했습니다."></textarea>
    </div>
    <div style="margin-top:16px" class="search-wrap">
      <svg class="ico" viewBox="0 0 24 24" style="width:14px;stroke:currentColor;fill:none;stroke-width:1.6"><path d="M16 16l5 5M18 10a8 8 0 1 1-16 0 8 8 0 0 1 16 0"/></svg>
      <input placeholder="메시지, 해시, 작성자, 파일 검색" />
    </div>
  </div>

  <div class="section-block">
    <p class="meta" style="margin-bottom:10px">태그 &amp; 배지</p>
    <span class="pill">예제</span>
    <span class="tag" style="margin-left:8px">develop</span>
    <span class="tag" style="margin-left:8px">feature/branch-filter</span>
  </div>

  <div class="section-block">
    <p class="meta" style="margin-bottom:4px">데이터 테이블 — 수치 컬럼은 mono + 우측 정렬</p>
    <table class="ds-table">
      <thead><tr><th>브랜치</th><th>작성자</th><th>커밋 메시지</th><th>ahead</th><th>behind</th></tr></thead>
      <tbody>
        <tr><td class="meta">feature/branch-filter</td><td>김민서</td><td>브랜치 필터 선택 UI 추가</td><td class="num-col">5</td><td class="num-col">2</td></tr>
        <tr><td class="meta">fix/keyboard-nav</td><td>최도윤</td><td>그래프 키보드 포커스 수정</td><td class="num-col">1</td><td class="num-col">3</td></tr>
        <tr><td class="meta">main</td><td>박지훈</td><td>v0.9.0 릴리스 준비</td><td class="num-col">0</td><td class="num-col">0</td></tr>
      </tbody>
    </table>
  </div>
</body>
</html>
